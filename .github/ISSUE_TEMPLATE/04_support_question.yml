---
name: ❓ Support Question
description: Ask how to use PROJECT_NAME
title: "support: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended conversation is usually a better fit for Discussions. Use this
        form when you have a specific question about using PROJECT_NAME.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I read the README and the documentation.
          required: true
        - label: I searched the existing issues and discussions.
          required: true

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe your goal, not only the step you are stuck on.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: Commands, configuration, or code you have already attempted.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit SHA you are running.
      placeholder: "v1.2.3, or 0a1b2c3"
    validations:
      required: false

---
name: ✨ Feature Request
description: Suggest an idea for PROJECT_NAME
title: "feat: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues and this has not been requested yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or limitation you are running into.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Preferred solution
      description: A clear description of what you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you looked at, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use cases, example code, screenshots, links to prior art.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to submit a pull request for this?
      description: Help is available if you would like to try but are not sure where to start.
      options:
        - "Yes"
        - "Yes, with guidance"
        - "No"
    validations:
      required: true

---
name: 🐛 Bug Report
description: Report a defect so that PROJECT_NAME can be fixed
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. The more precisely you can
        describe the problem, the faster it can be reproduced and fixed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues and this has not been reported yet.
          required: true
        - label: I am running the most recent version of PROJECT_NAME.
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit SHA you are running.
      placeholder: "v1.2.3, or 0a1b2c3"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What happens today? Describe how the bug manifests.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact sequence someone else can follow to see the same result.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime version, browser -- whatever is relevant here.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, errors, or code
      description: This is rendered as a code block automatically, so no backticks are needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Related issues, suggested fixes, links to discussions elsewhere.
    validations:
      required: false

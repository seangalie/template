---
name: Stale

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: 🧹 Clean up stale issues and PRs
    runs-on: ubuntu-latest
    permissions:
      # actions/stale keeps its progress in the Actions cache and needs this
      # to delete the previous run's entry.
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: 🚀 Run stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          # Bugs and anything with a priority are triaged work that stays open until
          # someone deals with it, however long that takes. The sweep is for
          # questions and ideas that lost momentum.
          exempt-issue-labels: >-
            no-stale,in-progress,help wanted,good first issue,security,bug,
            priority-critical,priority-high,priority-medium,priority-low
          stale-issue-message: >
            There hasn't been any activity on this issue recently, and in order
            to prioritize active issues, it will be marked as stale.

            Please make sure to update to the latest version and
            check if that solves the issue. Let us know if that works for you
            by leaving a 👍

            Because this issue is marked as stale, it will be closed in 14 days
            if no further activity occurs.

            Thank you for your contributions!
          stale-pr-label: "stale"
          exempt-pr-labels: "no-stale,in-progress"
          stale-pr-message: >
            There hasn't been any activity on this pull request recently, and in
            order to prioritize active work, it has been marked as stale.

            This PR will be closed in 14 days if no further activity occurs.

            Thank you for your contributions!

---
# CodeQL needs at least one supported language and may require GitHub Code
# Security for private repositories. It is manual-only in the template so a new,
# empty repository does not begin with a failing workflow.
#
# GitHub now recommends the UI-based "default setup" (Settings -> Code security
# -> Code scanning) for most repositories: it picks the languages, keeps the
# queries current, and needs no workflow file at all. Prefer it unless you need
# a custom build, custom query packs, or a non-standard matrix -- and if you do
# enable it, delete this workflow rather than running both.
#
# To keep this advanced setup instead: after code has landed, configure the
# matrix below for the languages and build modes your project uses, then
# uncomment the automatic triggers. Languages are auto-detected when the matrix
# remains commented. For example:
#   language: [javascript-typescript, python]
# See https://docs.github.com/code-security/code-scanning for the current list.

name: CodeQL

on:
  workflow_dispatch:
  # Enable these triggers after configuring CodeQL for the generated project.
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  # schedule:
  #   - cron: "30 1 * * 0"

permissions:
  contents: read

jobs:
  codeql:
    name: 🏭 Scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    # strategy:
    #   fail-fast: false
    #   matrix:
    #     language: [javascript-typescript]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # with:
        #   languages: ${{ matrix.language }}
      - name: 🏗 Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - name: 🚀 Perform CodeQL Analysis
        # When using the matrix above, also set:
        #   with:
        #     category: "/language:${{ matrix.language }}"
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

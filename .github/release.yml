---
# Groups GitHub's automatically generated release notes by label. Each pull
# request lands in the first category whose labels it matches, so the order
# below is the order of precedence. The labels come from .github/labels.yml.
#
# Reference: https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - "invalid"
  categories:
    - title: 💥 Breaking changes
      labels:
        - "breaking-change"
    - title: 🔒 Security
      labels:
        - "security"
    - title: ✨ New features and enhancements
      labels:
        - "new-feature"
        - "enhancement"
    - title: 🐛 Bug fixes
      labels:
        - "bugfix"
        - "bug"
    - title: ⚡ Performance
      labels:
        - "performance"
    - title: 📖 Documentation
      labels:
        - "documentation"
    - title: ⬆️ Dependencies
      labels:
        - "dependencies"
    - title: 🧰 Maintenance
      labels:
        - "refactor"
        - "maintenance"
        - "ci"
    - title: Other changes
      labels:
        - "*"

---
# Dependabot keeps the pinned versions in this repository current. The
# github-actions ecosystem is enabled by default because every template ships
# with workflows; uncomment the ecosystem below that matches your project.
#
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # Keep the actions used by .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release, so a compromised or broken
    # version has time to be caught and yanked upstream first.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      # One PR per week for all action bumps instead of one PR per action.
      github-actions:
        patterns:
          - "*"

